# M8, sparse risk factors on Fama-French 48 industry daily portfolios.
# Downloads the Ken French data library file (public, redistributable with
# attribution), filters to the modern era (2000-), standardizes per-industry,
# and fits FACET A-SQ, dense PCA, and sklearn SparsePCA at m=6 components.
# Hero: top-K FACET components with per-industry bars coloured by GICS-style
# sector grouping + Pareto frontier of (nnz, adjusted explained variance).

name: m8_finance
seed: 2041

data:
  min_year: 2000
  # Download is cached to this npz; subsequent runs are offline.
  cache_path: "papers/a/runs/m8/_cache_ff48_returns.npz"
  # Optional local source zip (bypasses the HTTP fetch); useful on networks
  # with TLS interception. Download manually from
  # https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/48_Industry_Portfolios_daily_CSV.zip
  # and drop at the path below.
  source_zip_path: "papers/a/runs/m8/48_Industry_Portfolios_daily_CSV.zip"

decomposition:
  m: 6

facet:
  gammas_sq: [0.05, 0.10, 0.20, 0.40, 0.80, 1.20]
  hero_gamma: 0.40

sparse_pca:
  alphas: [0.05, 0.2, 0.5, 1.0, 2.0, 4.0]

figure:
  hero_top_k_components: 4
  hero_top_k_industries_per_component: 12

output:
  csv: m8_finance.csv
  figure: m8_finance.png
