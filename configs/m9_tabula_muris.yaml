# M9-Tabula-Muris: sparse gene programs on mouse Tabula Muris FACS
# tissues. Native cell-type labels come from cell_ontology_class in the
# official annotations_facs.csv (not clustering-derived).
# One or more tissues are concatenated; defaults to the three largest
# immune tissues (Spleen + Marrow + Thymus) which share the FACS
# protocol and have well-populated cell-type annotations.

name: m9_tabula_muris
seed: 2048

data:
  data_root: "papers/a/runs/m9_tabula_muris"
  cache_path: "papers/a/runs/m9_tabula_muris/_cache_tabula_muris_preprocessed.npz"
  tissues: ["Spleen", "Thymus", "Marrow"]
  cells_per_tissue: null       # null = no cap
  n_hvg: 2000

decomposition:
  m: 10

facet:
  gamma_candidates: [0.05, 0.08, 0.12, 0.15, 0.20, 0.30, 0.50, 0.80, 1.20]

truncated_pca:
  top_k_per_component: [5, 10, 20, 40, 80, 160, 320, 640, 1200, 2000]

sparse_pca:
  alphas: [0.1, 0.5, 2.0, 4.0]

figure:
  hero_top_k_components: 4
  hero_top_k_genes: 15
  interpretability_top_k_genes: 15

interpretability:
  # On the mouse Tabula Muris mix (25 cell types in m=10 components) the
  # max-AMI FACET sits at a near-dense gamma. Loosen the tolerance here
  # so the interpretability selector picks a visibly sparse gamma without
  # dropping AMI below the dense-PCA baseline.
  reference: pca
  ami_tolerance: 0.08

output:
  csv: m9_tabula_muris.csv
  figure: m9_tabula_muris.png
  interpretability_figure: m9_tabula_muris_interpretability_hero.png
