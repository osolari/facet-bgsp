# M9-Zheng-FACS, sparse gene programs on Zheng17 bead-purified PBMCs.
# Native cell-type labels (FACS-sorted gate), not clustering-derived.
# Eight populations balanced at cells_per_population; same sweeping logic
# as m9_scrna.yaml. Dense PCA + truncated PCA + FACET A-SQ + SparsePCA.
# Hero: Pareto frontier of (nnz, AMI) + top FACET genes per component.
# Interp hero: enrichment vs top-K curves + two cell-type purity heatmaps.

name: m9_zheng_facs
seed: 2046

data:
  data_root: "papers/a/runs/m9_zheng_facs/raw"
  cache_path: "papers/a/runs/m9_zheng_facs/_cache_zheng_facs_preprocessed.npz"
  cells_per_population: 2000
  n_hvg: 2000

decomposition:
  m: 8

facet:
  gamma_candidates: [0.03, 0.05, 0.08, 0.12, 0.15, 0.20, 0.30, 0.50, 0.80, 1.20]

truncated_pca:
  top_k_per_component: [5, 10, 20, 40, 80, 160, 320, 640, 1200, 2000]

sparse_pca:
  alphas: [0.02, 0.05, 0.1, 0.3, 0.5, 1.0, 2.0, 4.0]

figure:
  hero_top_k_components: 4
  hero_top_k_genes: 15
  interpretability_top_k_genes: 15

interpretability:
  reference: best_facet
  ami_tolerance: 0.025

output:
  csv: m9_zheng_facs.csv
  figure: m9_zheng_facs.png
  interpretability_figure: m9_zheng_facs_interpretability_hero.png
