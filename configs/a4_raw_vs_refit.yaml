# A4, raw selection vs restricted refit (§14 required table #5 + figure).
# For each cell, measure (a) the restricted eigenvalue of A_S A_S^T attained
# by the raw iterate's loading (support-only, mask-first), (b) the restricted
# eigenvalue attained by refit_rank_one on the same support. The refit
# dominates raw on the restricted objective and the gap grows with
# problem difficulty.

name: a4_raw_vs_refit
seed_base: 2026

problem:
  p: 10
  n: 24
  k: 5
  singular_values: [2.0]       # modest signal so noise can tilt the restricted op

grid:
  noise_std: [0.0, 0.1, 0.25, 0.4]
  margin_fraction: [0.3, 0.6]
  replicates: 10

solver:
  # Deliberately loose: the raw iterate exits the Armijo loop before converging
  # on the restricted subproblem, so refit has room to improve on it. A
  # tighter solver (tolerance 1e-10) drives refit−raw → 0 on rank-1 clean spikes;
  # that's the point A4 illustrates, refit is a FIRST-CLASS stage, not an
  # alias for "run the solver longer".
  max_iterations: 60
  tolerance: 1.0e-5
  initial_angle_rad: 0.7

objective: squared

# Rank-2 controlled cells where the restricted operator genuinely has
# a secondary eigen direction, refit > raw by a visible margin because the
# raw iterate's gradient-step loading is biased by that secondary direction.
# label_noise is a cosmetic grouping key for the figure.
rank2_cells:
  - {lam1: 4.0, lam2: 1.0, label_noise: -0.10, replicates: 10}
  - {lam1: 4.0, lam2: 2.0, label_noise: -0.20, replicates: 10}
  - {lam1: 4.0, lam2: 3.0, label_noise: -0.30, replicates: 10}

output:
  csv: a4_results.csv
  figure: a4_raw_vs_refit.png
  table_tex: a4_raw_vs_refit.tex
