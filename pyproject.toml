[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facet-bgsp"
version = "1.0.0"
description = "Reproducibility companion for the BGSP paper: Corrected Block Sparse Spectral Optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Omid Solari", email = "solari@berkeley.edu" }]
keywords = [
  "sparse-pca",
  "block-generalized-power",
  "stiefel-manifold",
  "kurdyka-lojasiewicz",
  "safe-screening",
  "interpretability",
  "paper-companion",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  # Library distribution is published as ``facet-core`` on PyPI (the bare
  # ``facet`` name is held by an unrelated project); the import name
  # remains ``import facet``.
  "facet-core>=0.1.1,<0.2",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
llm = ["transformers>=5.19,<6.0", "torch>=2.14,<3.0"]
scrna = ["h5py>=3.10", "anndata>=0.10"]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/omidsolari/facet-bgsp"
Repository = "https://github.com/omidsolari/facet-bgsp"
Issues = "https://github.com/omidsolari/facet-bgsp/issues"
Library = "https://github.com/omidsolari/FACET"

[tool.setuptools]
# This repo is drivers + configs + paper source, not an importable package.
# The library it depends on is `facet` from PyPI. We ship no modules, only
# scripts under experiments/.
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: slow numerical or integration test",
  "gpu: requires a CUDA-capable environment",
]
